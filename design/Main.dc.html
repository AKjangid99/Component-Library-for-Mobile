<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary); } a:hover { color: var(--accent); }

    .page {
      --bg:#ffffff; --fg:#000000; --card:#f0f0f3; --muted-fg:#60646c;
      --border:#e0e1e6; --secondary:#e0e1e6; --primary:#208aef; --accent:#7c3aed;
      --success:#30a46c; --warning:#f5a524; --destructive:#e5484d;
      font-family:'Spline Sans', Inter, ui-sans-serif, system-ui, sans-serif;
      background:var(--bg); color:var(--fg); min-height:100%;
      transition: background .35s ease, color .35s ease; position:relative; overflow:hidden;
    }
    .page.dark {
      --bg:#000000; --fg:#ffffff; --card:#161719; --muted-fg:#b0b4ba;
      --border:#2e3135; --secondary:#2e3135; --primary:#3c87f7; --accent:#8b5cf6;
      --success:#3dd68c; --warning:#ffc53d; --destructive:#ff6369;
    }
    .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }

    .btn { position:relative; border:none; cursor:pointer; font-family:inherit; font-weight:600; letter-spacing:-.01em; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition: transform .16s cubic-bezier(.16,1,.3,1), filter .16s ease, box-shadow .16s ease; }
    .btn:active { transform: scale(.95); }
    .btn-primary { background:var(--primary); color:#fff; box-shadow:0 8px 22px color-mix(in oklab, var(--primary) 38%, transparent); }
    .btn-primary:hover { filter:brightness(1.05); }
    .btn-tonal { background:var(--secondary); color:var(--fg); }
    .btn-outline { background:transparent; color:var(--fg); border:1px solid var(--border); }
    .btn-ghost { background:transparent; color:var(--fg); border:1px solid var(--border); }

    .chip { cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted-fg); font-family:inherit; font-weight:600; font-size:13px; border-radius:9999px; padding:8px 14px; transition: all .18s ease; }
    .chip:hover { border-color: color-mix(in oklab, var(--primary) 45%, var(--border)); }
    .chip.on { border-color:var(--primary); background:color-mix(in oklab, var(--primary) 14%, transparent); color:var(--primary); }

    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; }
    .stage { position:relative; display:flex; align-items:center; justify-content:center; }
    .layer { position:absolute; inset:0; pointer-events:none; overflow:visible; }
    .layer > div { position:absolute; }

    svg { display:block; }

    /* ---- celebration keyframes (finish by ~42%, hold to 100% = built-in rest) ---- */
    @keyframes p-spark {
      0%   { transform: translate(-50%,-50%) scale(.3); opacity:0; }
      8%   { opacity:1; }
      42%  { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.4); opacity:0; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.4); opacity:0; }
    }
    @keyframes p-star {
      0%   { transform: translate(-50%,-50%) scale(.2); opacity:0; }
      12%  { opacity:1; transform: translate(calc(-50% + calc(var(--tx) * .35)), calc(-50% + calc(var(--ty) * .35))) scale(1.2); }
      42%  { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.85); opacity:0; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.85); opacity:0; }
    }
    @keyframes p-conf {
      0%   { transform: translate(-50%,-50%) rotate(0deg); opacity:1; }
      42%  { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)); opacity:0; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)); opacity:0; }
    }
    @keyframes p-heart {
      0%   { transform: translate(-50%,-50%) scale(.4); opacity:0; }
      14%  { opacity:1; }
      42%  { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); opacity:0; }
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); opacity:0; }
    }
    @keyframes p-ring {
      0%   { transform: translate(-50%,-50%) scale(.25); opacity:.7; }
      42%  { transform: translate(-50%,-50%) scale(3.2); opacity:0; }
      100% { transform: translate(-50%,-50%) scale(3.2); opacity:0; }
    }
    @keyframes p-pop {
      0%   { transform: translate(-50%,-50%) scale(.4); opacity:0; }
      12%  { transform: translate(-50%, calc(-50% - 40px)) scale(1); opacity:1; }
      30%  { transform: translate(-50%, calc(-50% - 40px)) scale(1); opacity:1; }
      42%  { transform: translate(-50%, calc(-50% - 66px)) scale(1); opacity:0; }
      100% { transform: translate(-50%, calc(-50% - 66px)) scale(1); opacity:0; }
    }
    @keyframes fadein { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none;} }
    .rise { animation: fadein .6s cubic-bezier(.16,1,.3,1) both; }
  </style>
</helmet>

<div class="page {{themeClass}}">
  <div style="position:relative; max-width:960px; margin:0 auto; padding:34px 40px 52px;">

    <!-- header -->
    <div class="rise" style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div class="mono" style="font-size:11px; text-transform:uppercase; letter-spacing:.2em; color:var(--muted-fg);">Component Lab</div>
        <div style="font-size:26px; font-weight:700; letter-spacing:-.02em; margin-top:4px;">Button celebrations</div>
      </div>
      <button class="btn btn-outline" onClick="{{ toggleTheme }}" style="width:40px; height:40px; padding:0;"><span>{{ themeIcon }}</span></button>
    </div>

    <!-- HERO interactive -->
    <div class="card rise" style="animation-delay:.05s; margin-top:24px; padding:28px; display:flex; flex-direction:column; align-items:center; gap:22px;">
      <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        <sc-for list="{{effectChips}}" as="c" hint-placeholder-count="6">
          <button class="chip {{c.cls}}" onClick="{{ c.pick }}">{{c.label}}</button>
        </sc-for>
      </div>

      <div class="stage" style="height:150px; width:100%;">
        <button class="btn btn-primary" onClick="{{ fire }}" style="height:56px; padding:0 30px; font-size:17px;">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 5.2 5.6.5-4.2 3.7 1.3 5.5L12 19.7 6.9 22.4l1.3-5.5L4 13.2l5.6-.5z"/></svg></span>
          {{heroLabel}}
        </button>
        <div class="layer">
          <sc-if value="{{live}}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{heroParticles}}" as="p" hint-placeholder-count="7">
              <div style="{{p.style}}">{{p.inner}}</div>
            </sc-for>
          </sc-if>
        </div>
      </div>

      <div style="font-size:13px; color:var(--muted-fg); text-align:center; max-width:440px;">
        Tap the button to replay — the burst fires on release, never blocking <span class="mono" style="font-size:12px;">onPress</span>. It auto-demos every few seconds.
      </div>
    </div>

    <!-- GALLERY -->
    <div class="rise" style="animation-delay:.12s; margin-top:34px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <div style="font-size:16px; font-weight:600;">The menu</div>
        <div style="font-size:12px; color:var(--muted-fg);">green = shipping today · violet = new ideas</div>
      </div>

      <div style="display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px; margin-top:16px;">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
          <div class="card" style="padding:18px; display:flex; flex-direction:column; gap:14px;">
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <span style="font-size:14px; font-weight:600;">{{t.name}}</span>
              <span style="font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:9999px; background:{{t.tagbg}}; color:{{t.tagfg}};">{{t.tag}}</span>
            </div>
            <div class="stage" style="height:96px;">
              <button class="btn {{t.btnCls}}" style="height:40px; padding:0 16px; font-size:14px;">{{t.btnLabel}}</button>
              <div class="layer">
                <sc-for list="{{t.particles}}" as="p" hint-placeholder-count="6">
                  <div style="{{p.style}}">{{p.inner}}</div>
                </sc-for>
              </div>
            </div>
            <div style="font-size:12px; line-height:1.5; color:var(--muted-fg);">{{t.desc}}</div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":960,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark:false, effect:'confetti', live:true, playId:1 };
  }
  componentDidMount() {
    this._iv = setInterval(() => this.fire(), 2900);
  }
  componentWillUnmount() { if (this._iv) clearInterval(this._iv); if (this._t) clearTimeout(this._t); }

  fire() {
    this.setState({ live:false });
    if (this._t) clearTimeout(this._t);
    this._t = setTimeout(() => this.setState((s) => ({ live:true, playId:s.playId + 1 })), 40);
  }

  // ---- svg builders ----
  starSvg(color) { return '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="' + color + '"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 8.9l6.9-.6z"/></svg>'; }
  heartSvg(color) { return '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="' + color + '"><path d="M12 21s-7.5-4.8-10-9.3C.6 8.9 2 5.5 5.2 5.1 7 4.9 8.7 5.9 12 8.9c3.3-3 5-4 6.8-3.8C22 5.5 23.4 8.9 22 11.7 19.5 16.2 12 21 12 21z"/></svg>'; }
  checkSvg() { return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; }

  colors() { return ['#F5A524', '#208AEF', '#30A46C', '#8E5CF5', '#E5484D', '#ec4899', '#F5A524']; }

  // ---- particle generators. loop=true => infinite (gallery); scale shrinks travel. ----
  particlesFor(effect, loop, scale) {
    const iter = loop ? 'infinite' : '1';
    const s = scale || 1;
    const cols = this.colors();
    const anim = (kf, dur, delay) => kf + ' ' + dur + 'ms cubic-bezier(.16,1,.3,1) ' + delay + 'ms ' + iter + ' both';
    const base = 'position:absolute; left:50%; top:50%;';
    const dur = loop ? 2600 : 1500;
    const out = [];

    if (effect === 'sparkles') {
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        const d = (66 + (i % 3) * 12) * s;
        const sz = (7 + (i % 2) * 2);
        out.push({ inner:'', style: base + 'width:' + sz + 'px; height:' + sz + 'px; border-radius:50%; background:' + cols[i] + '; --tx:' + (Math.cos(a) * d).toFixed(1) + 'px; --ty:' + (Math.sin(a) * d).toFixed(1) + 'px; animation:' + anim('p-spark', dur, (i % 3) * 30) + ';' });
      }
    } else if (effect === 'stars') {
      const angs = [-140, -108, -84, -60, -96];
      for (let i = 0; i < 5; i++) {
        const a = (angs[i] * Math.PI) / 180;
        const d = (78 + (i % 3) * 14) * s;
        const sz = 15 + (i % 3) * 3;
        out.push({ inner:this.starSvg('#F5A524'), style: base + 'width:' + sz + 'px; height:' + sz + 'px; --tx:' + (Math.cos(a) * d).toFixed(1) + 'px; --ty:' + (Math.sin(a) * d).toFixed(1) + 'px; animation:' + anim('p-star', dur, i * 55) + ';' });
      }
    } else if (effect === 'confetti') {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const d = (70 + (i % 4) * 16) * s;
        const rot = (i * 57 % 360);
        out.push({ inner:'', style: base + 'width:6px; height:11px; border-radius:2px; background:' + cols[i % cols.length] + '; --tx:' + (Math.cos(a) * d).toFixed(1) + 'px; --ty:' + (Math.sin(a) * d + 26 * s).toFixed(1) + 'px; --rot:' + rot + 'deg; animation:' + anim('p-conf', loop ? 2600 : 1700, (i % 4) * 20) + ';' });
      }
    } else if (effect === 'hearts') {
      const angs = [-120, -95, -70, -105, -80];
      for (let i = 0; i < 5; i++) {
        const a = (angs[i] * Math.PI) / 180;
        const d = (70 + (i % 3) * 16) * s;
        const sz = 16 + (i % 3) * 4;
        out.push({ inner:this.heartSvg(i % 2 ? '#ec4899' : '#E5484D'), style: base + 'width:' + sz + 'px; height:' + sz + 'px; --tx:' + (Math.cos(a) * d).toFixed(1) + 'px; --ty:' + (Math.sin(a) * d).toFixed(1) + 'px; animation:' + anim('p-heart', loop ? 2600 : 1700, i * 60) + ';' });
      }
    } else if (effect === 'rings') {
      for (let i = 0; i < 3; i++) {
        const sz = 40 * s;
        out.push({ inner:'', style: base + 'width:' + sz + 'px; height:' + sz + 'px; border-radius:9999px; border:2px solid var(--primary); background:transparent; animation:' + anim('p-ring', loop ? 2400 : 1300, i * 150) + ';' });
      }
    } else if (effect === 'popup') {
      out.push({ inner:this.checkSvg() + '<span style="font-size:12px; font-weight:700; color:#fff;">+1</span>', style: base + 'display:flex; align-items:center; gap:4px; background:var(--success); border-radius:9999px; padding:4px 10px; animation:' + anim('p-pop', loop ? 2600 : 1600, 0) + ';' });
    }
    return out;
  }

  renderVals() {
    const st = this.state;
    const sun = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const moon = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';

    const effects = [
      { id:'confetti', label:'Confetti' },
      { id:'sparkles', label:'Sparkles' },
      { id:'stars', label:'Stars' },
      { id:'hearts', label:'Hearts' },
      { id:'rings', label:'Rings' },
      { id:'popup', label:'Popup +1' },
    ];
    const labelMap = { confetti:'Publish', sparkles:'Save', stars:'Star', hearts:'Like', rings:'Send', popup:'Upvote' };

    const effectChips = effects.map((e) => ({
      label: e.label,
      cls: e.id === st.effect ? 'on' : '',
      pick: () => { this.setState({ effect: e.id }); this.fire(); },
    }));

    const shipping = { confetti:false, sparkles:true, stars:true, hearts:false, rings:false, popup:true };
    const tileMeta = {
      sparkles: { name:'Sparkles', desc:'Six dots burst radially and fade. The calm all-rounder.', btnCls:'btn-primary', btnLabel:'Save' },
      stars:    { name:'Stars', desc:'Star symbols rise and pop, staggered — great for favourites.', btnCls:'btn-tonal', btnLabel:'Star' },
      popup:    { name:'Popup +1', desc:'A “✓ +1” badge springs up above the button, holds, floats off.', btnCls:'btn-outline', btnLabel:'Upvote' },
      confetti: { name:'Confetti', desc:'Colored shreds fly out, spin and fall. The big celebratory moment.', btnCls:'btn-primary', btnLabel:'Publish' },
      hearts:   { name:'Hearts', desc:'Soft hearts drift upward — playful likes and reactions.', btnCls:'btn-ghost', btnLabel:'Like' },
      rings:    { name:'Rings', desc:'Concentric ripples expand outward — a crisp, minimal confirm.', btnCls:'btn-tonal', btnLabel:'Send' },
    };
    const order = ['sparkles','stars','popup','confetti','hearts','rings'];
    const tiles = order.map((id) => {
      const m = tileMeta[id];
      const ship = shipping[id];
      return {
        name: m.name, desc: m.desc, btnCls: m.btnCls, btnLabel: m.btnLabel,
        tag: ship ? 'Live' : 'New',
        tagbg: ship ? 'color-mix(in oklab, var(--success) 16%, transparent)' : 'color-mix(in oklab, var(--accent) 16%, transparent)',
        tagfg: ship ? 'var(--success)' : 'var(--accent)',
        particles: this.particlesFor(id, true, 0.62),
      };
    });

    return {
      themeClass: st.dark ? 'dark' : '',
      themeIcon: st.dark ? sun : moon,
      toggleTheme: () => this.setState({ dark: !st.dark }),
      effectChips,
      heroLabel: labelMap[st.effect] || 'Tap me',
      live: st.live,
      heroParticles: this.particlesFor(st.effect, false, 1),
      fire: () => this.fire(),
      tiles,
    };
  }
}
</script>
</body>
</html>
